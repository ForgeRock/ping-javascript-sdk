packages:
  - 'packages/*'
  - 'packages/sdk-effects/*'
  - 'packages/utils/*'
  - '!**/test/**'
  - 'e2e/*'
  - 'tools/*'
  - 'scratchpad'
catalog:
  '@forgerock/javascript-sdk': '4.9.0'
  jose: '^6.0.0'
  '@reduxjs/toolkit': '^2.8.2'
  '@types/express': '5.0.6'
  immer: '^10.1.1'
  msw: '^2.5.1'
  tslib: '^2.5.0'
  tsx: '4.21.0'
catalogs:
  effect:
    effect: '4.0.0-beta.103'
    '@effect/language-service': '0.87.1'
    '@effect/platform-node': '4.0.0-beta.103'
    '@effect/vitest': '4.0.0-beta.103'
    '@effect/opentelemetry': '4.0.0-beta.103'
  vitest:
    vitest: '^4.1.0'
    '@vitest/coverage-v8': '^4.1.0'
    '@vitest/ui': '^4.1.0'
    'vitest-canvas-mock': '^1.1.4'
  vite:
    vite: '^7.3.6'

link-workspace-packages: true
strict-peer-dependencies: false
save-workspace-protocol: 'rolling'
save-prefix: ''
