pre-commit:
  piped: true
  commands:
    nx-sync:
      priority: 1
      run: pnpm nx sync
    copyright-sync:
      priority: 2
      run: node tools/copyright/sync-header-years.mjs --fix
      stage_fixed: true
    nx-affected:
      priority: 3
      run: pnpm nx affected -t typecheck lint build api-report --head=HEAD --base=main --tui=false
      stage_fixed: true
      interactive: false
      env:
        NX_CACHE_DIRECTORY: .nx/cache
    format:
      priority: 4
      run: pnpm nx format:write
      stage_fixed: true
    syncpack:
      priority: 5
      glob: >-
        {package.json,
        pnpm-workspace.yaml,
        packages/*/package.json,
        packages/sdk-effects/*/package.json,
        packages/utils/*/package.json,
        e2e/*/package.json,
        tools/*/package.json,
        scratchpad/package.json}
      run: pnpm syncpack:lint
    interface-mapping:
      priority: 6
      glob: >-
        {tools/interface-mapping-validator/**/*.ts,
        interface_mapping.md,
        packages/*/src/index.ts,
        packages/*/src/types.ts,
        packages/*/package.json,
        packages/sdk-effects/*/src/index.ts,
        packages/sdk-effects/*/src/types.ts,
        packages/sdk-effects/*/package.json}
      run: >
        pnpm tsx tools/interface-mapping-validator/src/main.ts ||
        (echo "" &&
         echo "Interface mapping is out of sync." &&
         echo "Run: pnpm mapping:generate" &&
         exit 1)
commit-msg:
  commands:
    commitlint:
      run: pnpm run commitlint {1}

prepare-commit-msg:
  commands:
    commitizen:
      interactive: true
      run: |
        if [ "$2" = "template" ]; then
          exec < /dev/tty && pnpm run commit || true
        fi
