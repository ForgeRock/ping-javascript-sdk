name: 'Setup Project'
description: 'Centralized setup for CI jobs'
inputs:
  node-version-file:
    description: 'Node version file'
    required: false
    default: '.node-version'
  pnpm-cache-folder:
    description: 'pnpm cache folder'
    required: false
    default: '.pnpm-store'
  CODECOV_TOKEN:
    description: 'CODECOV_TOKEN'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup pnpm config
      run: pnpm config set store-dir ${{ inputs.pnpm-cache-folder }} --global
      shell: bash

    # Make sure the pnpm store path exists so Node.js installation can find it
    # https://github.com/actions/setup-node/issues/1137#issuecomment-2508963254
    - name: Verify PNPM Cache Directory
      shell: bash
      run: |
        PNPM_STORE_PATH="$( pnpm store path --silent )"
        if [ ! -d "$PNPM_STORE_PATH" ]; then
          echo "PNPM store directory does not exist, creating it."
          mkdir -p "$PNPM_STORE_PATH"
        else
          echo "PNPM store directory exists."
        fi

    - uses: actions/setup-node@v6
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Nx Cloud start
      run: pnpm dlx nx-cloud start-ci-run --distribute-on=".nx/workflows/dynamic-changesets.yml" --stop-agents-after="e2e-ci" --with-env-vars="CODECOV_TOKEN"
      shell: bash
      env:
        CODECOV_TOKEN: ${{ inputs.CODECOV_TOKEN }}

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install

    - name: Set Nx SHAs
      uses: nrwl/nx-set-shas@v4

    - name: Check TS References are Synced
      shell: bash
      run: pnpm nx sync:check

    - name: Run Nx build, lint, test, typecheck, e2e
      run: pnpm exec nx affected -t build lint test typecheck e2e-ci
      shell: bash

    - name: Upload Playwright report
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          ./e2e/*/.playwright/**
          ./e2e/**/.playwright/**
        retention-days: 30
